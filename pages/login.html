<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北護公司 - 登入</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f2f4f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .phone-frame {
            width: 393px; height: 852px; background-color: #ffffff; border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px;
        }
        
        /* 圓形標誌 */
        .logo-circle {
            width: 110px; height: 110px; background-color: #e6f2ff; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 30px;
        }
        .logo-circle span {
            font-size: 20px; font-weight: bold; color: #111; line-height: 1.3; text-align: center;
        }

        /* 快速帶入按鈕區域 */
        .quick-fill-box {
            width: 100%; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; color: #6b7280;
        }
        .quick-btn {
            background-color: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 12px;
            font-size: 12px; color: #374151; cursor: pointer; font-weight: 500; transition: all 0.2s;
        }
        .quick-btn:hover { background-color: #e5e7eb; color: #111; }

        /* 輸入框區域 */
        .form-container {
            width: 100%; display: flex; flex-direction: column; gap: 16px;
        }
        .form-input {
            width: 100%; padding: 16px 20px; background-color: #eef1f5; border: none; border-radius: 14px;
            font-size: 15px; color: #333; outline: none;
        }
        .form-input::placeholder { color: #9ca3af; }

        /* 登入按鈕 */
        .login-btn {
            width: 100%; background-color: #93c5fd; color: white; border: none; border-radius: 14px;
            padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px;
            transition: background-color 0.2s;
        }
        .login-btn:hover { background-color: #60a5fa; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 圓形標誌 -->
        <div class="logo-circle">
            <span>北護<br>公司</span>
        </div>

        <!-- 快速選擇常用帳號（點擊後自動填入帳號與密碼） -->
        <div class="quick-fill-box">
            <span>快速帶入：</span>
            <button type="button" class="quick-btn" onclick="fillCredentials('122214241', '000000')">主管 (鄒)</button>
            <button type="button" class="quick-btn" onclick="fillCredentials('122214228', '777777')">員工 (劉)</button>
        </div>

        <!-- 登入表單 -->
        <form class="form-container" onsubmit="handleLogin(); return false;">
            <input type="text" id="username-input" name="username" autocomplete="username" class="form-input" placeholder="請輸入員工編號" required>
            <input type="password" id="password-input" name="current-password" autocomplete="current-password" class="form-input" placeholder="請輸入密碼" required>
            <button type="submit" class="login-btn">登入</button>
        </form>
    </div>

    <script>
        // 一鍵填入對應帳號密碼的輔助函式
        function fillCredentials(username, password) {
            document.getElementById('username-input').value = username;
            document.getElementById('password-input').value = password;
        }

        function handleLogin() {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value.trim();

            // 主管帳號判斷
            if (username === '122214241' && password === '000000') {
                localStorage.setItem('current_role', 'manager');
                localStorage.setItem('current_user', JSON.stringify({
                    name: '鄒O伶',
                    title: '研發部 主管',
                    role: 'manager'
                }));
                window.location.href = 'home.html';
            } 
            // 一般員工帳號判斷
            else if (username === '122214228' && password === '777777') {
                localStorage.setItem('current_role', 'staff');
                localStorage.setItem('current_user', JSON.stringify({
                    name: '劉O瑜',
                    title: '研發部 專員',
                    role: 'staff'
                }));
                window.location.href = 'home.html';
            } 
            // 帳號密碼錯誤提示
            else {
                alert('帳號或密碼錯誤！\n\n【主管帳號】\n編號：122214241\n密碼：000000\n\n【一般員工帳號】\n編號：122214228\n密碼：777777');
            }
        }
    </script>
</body>
</html>
