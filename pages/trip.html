<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出差申請</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f2f4f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .phone-frame {
            width: 393px; height: 852px; background-color: #ffffff; border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 24px 20px;
        }
        .top-bar {
            display: flex; align-items: center; margin-bottom: 20px;
        }
        .back-btn {
            background: none; border: none; font-size: 18px; font-weight: bold; color: #3b82f6; cursor: pointer; text-decoration: none;
        }
        .page-title-main {
            flex: 1; text-align: center; font-size: 18px; font-weight: bold; color: #111; margin-right: 24px;
        }

        .open-modal-btn {
            background-color: #3b82f6; color: white; border: none; border-radius: 14px;
            padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 40px;
            text-align: center; width: 100%;
        }
        .open-modal-btn:hover { background-color: #2563eb; }

        /* 彈窗 Modal 樣式 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); display: flex;
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal-box {
            background-color: #ffffff; width: 345px; border-radius: 24px; padding: 24px 20px;
            display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative; max-height: 90vh; overflow-y: auto;
        }
        
        .modal-user-header {
            display: flex; align-items: center; justify-content: space-between; position: relative;
        }
        .user-info-left {
            display: flex; align-items: center; gap: 10px;
        }
        .user-avatar {
            width: 40px; height: 40px; background-color: #d1d5db; border-radius: 50%;
        }
        .user-details {
            display: flex; flex-direction: column; gap: 2px;
        }
        .user-name { font-size: 15px; font-weight: bold; color: #111; }
        .user-dept { font-size: 12px; color: #6b7280; }
        .close-btn { 
            background: none; border: none; font-size: 18px; font-weight: bold; color: #111; cursor: pointer; 
            padding: 4px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
        }

        .modal-title {
            text-align: center; font-size: 18px; font-weight: bold; color: #111; margin-top: 4px; margin-bottom: 2px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #374151; }
        
        .form-label-row {
            display: flex; justify-content: space-between; align-items: center;
        }
        .form-group label { font-weight: 600; color: #374151; text-align: center; width: 100%; }
        .form-label-row label { width: auto; text-align: left; }
        
        .common-reason-btn {
            background-color: #e5e7eb; border: none; border-radius: 6px; padding: 2px 8px; font-size: 11px; color: #4b5563; cursor: pointer; font-weight: 500;
        }
        .common-reason-btn:hover { background-color: #d1d5db; }

        .form-control {
            width: 100%; padding: 12px 14px; background-color: #f3f4f6; border: none; border-radius: 14px; font-size: 14px; outline: none; color: #111;
            text-align: center;
            text-align-last: center;
        }
        
        textarea.form-control { 
            resize: none; height: 80px; text-align: left; border-radius: 14px; padding: 12px;
        }

        .btn-submit {
            width: 100%; padding: 14px; background-color: #e0f2fe; border: none; border-radius: 20px; font-size: 15px; font-weight: bold; cursor: pointer; color: #0284c7; margin-top: 6px; text-align: center;
        }
        .btn-submit:hover { background-color: #bae6fd; }

        /* 常用事由選擇子彈窗 */
        .sub-modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4); display: none;
            justify-content: center; align-items: center; z-index: 110;
        }
        .sub-modal-box {
            background-color: #ffffff; width: 310px; border-radius: 20px; padding: 20px 16px;
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }
        .sub-modal-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
        }
        .sub-modal-title {
            width: 100%; text-align: center; font-size: 16px; font-weight: bold; color: #111;
        }
        .reason-item-row {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #fdf2f2; border-radius: 10px; padding: 12px 16px;
            font-size: 14px; color: #111; font-weight: 500; cursor: pointer;
        }
        .reason-item-row:hover { background-color: #fce8e8; }
        .reason-add-icon { font-weight: bold; font-size: 16px; color: #111; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="top-bar">
            <a class="back-btn" href="home.html">‹ 返回</a>
            <div class="page-title-main">出差申請</div>
        </div>

        <button class="open-modal-btn" onclick="openModal()">+ 新增出差申請</button>

        <div id="trip-modal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-user-header">
                    <div class="user-info-left">
                        <div class="user-avatar"></div>
                        <div class="user-details">
                            <span class="user-name" id="display-user-name">載入中...</span>
                            <span class="user-dept" id="display-user-dept">載入中...</span>
                        </div>
                    </div>
                    <a href="home.html" class="close-btn">✕</a>
                </div>

                <div class="modal-title">出差申請</div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label style="text-align: left; width: auto;">出差事由</label>
                        <button class="common-reason-btn" onclick="openSubModal()">+ 常用事由</button>
                    </div>
                    <textarea id="trip-reason" class="form-control" placeholder="請輸入出差事由......"></textarea>
                </div>

                <div class="form-group">
                    <label>地點</label>
                    <input type="text" id="trip-location" class="form-control" placeholder="請輸入出差地點......" style="text-align: center;">
                </div>

                <div class="form-group">
                    <label>開始時間</label>
                    <input type="datetime-local" id="start-time" class="form-control">
                </div>

                <div class="form-group">
                    <label>結束時間</label>
                    <input type="datetime-local" id="end-time" class="form-control">
                </div>

                <div class="form-group">
                    <label>預估費用</label>
                    <input type="number" id="trip-cost" class="form-control" placeholder="請輸入預估費用......">
                </div>

                <button class="btn-submit" onclick="submitTrip()">確認送出</button>
            </div>

            <!-- 常用事由選擇彈窗 -->
            <div id="sub-modal" class="sub-modal-overlay">
                <div class="sub-modal-box">
                    <div class="sub-modal-header">
                        <div class="sub-modal-title">選擇事由</div>
                        <button onclick="closeSubModal()" style="background:none;border:none;font-size:16px;font-weight:bold;cursor:pointer;position:absolute;right:16px;">✕</button>
                    </div>
                    <div class="reason-item-row" onclick="selectReason('出差')">
                        <span>出差</span><span class="reason-add-icon">+</span>
                    </div>
                    <div class="reason-item-row" onclick="selectReason('出差開會')">
                        <span>出差開會</span><span class="reason-add-icon">+</span>
                    </div>
                    <div class="reason-item-row" onclick="selectReason('會議')">
                        <span>會議</span><span class="reason-add-icon">+</span>
                    </div>
                    <div class="reason-item-row" onclick="selectReason('業務督導')">
                        <span>業務督導</span><span class="reason-add-icon">+</span>
                    </div>
                    <div class="reason-item-row" onclick="selectReason('整節活動')">
                        <span>整節活動</span><span class="reason-add-icon">+</span>
                    </div>
                    <div class="reason-item-row" onclick="selectReason('考察')">
                        <span>考察</span><span class="reason-add-icon">+</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 頁面載入時自動讀取登入的使用者資訊
        window.addEventListener('DOMContentLoaded', () => {
            const currentUser = JSON.parse(localStorage.getItem('current_user')) || { name: '王小明', department: '研發部' };
            document.getElementById('display-user-name').textContent = currentUser.name;
            document.getElementById('display-user-dept').textContent = currentUser.department || '研發部';
        });

        function openModal() {
            document.getElementById('trip-modal').style.display = 'flex';
        }

        function openSubModal() {
            document.getElementById('sub-modal').style.display = 'flex';
        }

        function closeSubModal() {
            document.getElementById('sub-modal').style.display = 'none';
        }

        function selectReason(reasonText) {
            document.getElementById('trip-reason').value = reasonText;
            closeSubModal();
        }

        function submitTrip() {
            const reason = document.getElementById('trip-reason').value.trim();
            const location = document.getElementById('trip-location').value.trim();
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;
            const cost = document.getElementById('trip-cost').value;

            if (!reason || !location || !startTime || !endTime) {
                alert('請完整填寫必填欄位！');
                return;
            }

            const currentUser = JSON.parse(localStorage.getItem('current_user')) || { name: '王小明' };

            const newRecord = {
                id: Date.now(),
                userName: currentUser.name,
                type: '出差: ' + location,
                startDate: startTime.replace('T', ' '),
                endDate: endTime.replace('T', ' '),
                reason: reason,
                agent: '無',
                status: 'pending',
                timestamp: new Date().toLocaleDateString()
            };

            let leaveRecords = JSON.parse(localStorage.getItem('leave_records')) || [];
            leaveRecords.push(newRecord);
            localStorage.setItem('leave_records', JSON.stringify(leaveRecords));

            alert('出差申請已送出！');
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
