<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工打卡系統 - 首頁</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f2f4f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .phone-frame {
            width: 393px; height: 852px; background-color: #ffffff; border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); position: relative; overflow-y: auto; display: flex; flex-direction: column; padding: 24px 20px;
        }
        
        /* 頂部列（含登出按鈕） */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px;
        }
        .logout-link { color: #ef4444; text-decoration: none; font-weight: bold; cursor: pointer; }
        .logout-link:hover { text-decoration: underline; }

        /* 用戶 Header */
        .user-header { display: flex; align-items: center; margin-bottom: 16px; }
        .avatar { width: 48px; height: 48px; background-color: #e5e7eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 12px; }
        .user-info h3 { font-size: 16px; font-weight: bold; color: #111; }
        .user-info p { font-size: 13px; color: #6b7280; }

        /* 上方時數統計卡片 */
        .stats-card {
            background-color: #f0f7ff; border-radius: 20px; padding: 16px; display: flex; justify-content: space-around; text-align: center; margin-bottom: 16px;
        }
        .stat-item .label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .stat-item .value { font-size: 16px; font-weight: bold; color: #1e3a8a; }

        /* 打卡鐘卡片 */
        .clock-card {
            background-color: #f0f7ff; border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px;
        }
        .clock-label { font-size: 14px; color: #4b5563; margin-bottom: 4px; }
        .clock-time { font-size: 32px; font-weight: bold; color: #111; margin-bottom: 4px; }
        .clock-date { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
        .clock-btns { display: flex; justify-content: center; gap: 20px; }
        .clock-btn {
            width: 80px; height: 80px; border-radius: 50%; border: none; background-color: #e5e7eb; color: #374151; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.2s;
        }
        .clock-btn:hover { background-color: #d1d5db; }

        /* 功能按鈕網格排版 */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .menu-btn {
            background-color: #f0f7ff; border: none; border-radius: 16px; padding: 18px 12px;
            font-size: 15px; font-weight: bold; color: #111; cursor: pointer; text-align: center;
            display: flex; align-items: center; justify-content: center; position: relative;
            transition: background-color 0.2s;
        }
        .menu-btn:hover { background-color: #e0f2fe; }
        .menu-btn-full { grid-column: span 2; }

        /* 標籤紅點 */
        .badge {
            position: absolute; top: 10px; right: 12px;
            background-color: #ef4444; color: white; padding: 2px 7px;
            border-radius: 10px; font-size: 11px; font-weight: bold;
            display: none;
        }

        /* 打卡結果彈窗 Modal 樣式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background-color: #e6f2ff; width: 320px; border-radius: 24px; padding: 24px;
            text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-close {
            position: absolute; top: 16px; right: 16px; background: none; border: none;
            font-size: 16px; font-weight: bold; color: #333; cursor: pointer;
        }
        .modal-icon { margin: 12px auto 16px; display: flex; justify-content: center; align-items: center; }
        .modal-text { font-size: 16px; font-weight: bold; color: #111; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 頂部列：登出功能 -->
        <div class="top-bar">
            <span id="role-display-tag" style="color: #64748b; font-weight: bold;">身分：載入中...</span>
            <a class="logout-link" onclick="handleLogout()">登出系統</a>
        </div>

        <!-- 用戶資訊 -->
        <div class="user-header">
            <div class="avatar">
                <svg width="24" height="24" fill="none" stroke="#9ca3af" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div class="user-info">
                <h3 id="user-name">載入中...</h3>
                <p id="user-title">載入中...</p>
            </div>
        </div>

        <!-- 時數統計 -->
        <div class="stats-card">
            <div class="stat-item"><div class="label">可休</div><div class="value">21日<br>04時</div></div>
            <div class="stat-item"><div class="label">可補</div><div class="value">16日<br>04時</div></div>
            <div class="stat-item"><div class="label">加班</div><div class="value">10日<br>01分</div></div>
        </div>

        <!-- 打卡鐘 -->
        <div class="clock-card">
            <div class="clock-label">現在時間</div>
            <div class="clock-time" id="real-time">09:28:07</div>
            <div class="clock-date" id="real-date">4/29/2026</div>
            <div class="clock-btns">
                <button class="clock-btn" onclick="handleClockIn('上班')">上班<br>打卡</button>
                <button class="clock-btn" onclick="handleClockIn('下班')">下班<br>打卡</button>
            </div>
        </div>

        <!-- 功能按鈕區 -->
        <div class="menu-grid">
            <button class="menu-btn" onclick="location.href='leave.html'">請假申請</button>
            <button class="menu-btn" onclick="location.href='overtime.html'">加班申請</button>
            <button class="menu-btn" onclick="location.href='trip.html'">出差申請</button>
            
            <button class="menu-btn" onclick="markAsViewedAndGo()">
                申請紀錄
                <span id="history-badge" class="badge">0</span>
            </button>

            <button class="menu-btn menu-btn-full" onclick="location.href='approve.html'" style="background-color: #eef2ff; color: #4f46e5;">
                表單簽核
                <span id="pending-badge" class="badge">0</span>
            </button>
        </div>
    </div>

    <!-- 打卡結果彈窗 -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        function handleLogout() {
            localStorage.removeItem('current_user');
            localStorage.removeItem('current_role');
            window.location.href = 'login.html';
        }

        function initUserSession() {
            let savedUser = JSON.parse(localStorage.getItem('current_user'));
            if (!savedUser) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('user-name').innerText = savedUser.name;
            document.getElementById('user-title').innerText = savedUser.title;
            document.getElementById('role-display-tag').innerText = `身分：${savedUser.role === 'manager' ? '主管' : '一般員工'}`;
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('real-time').innerText = `${hours}:${minutes}:${seconds}`;

            const month = now.getMonth() + 1;
            const day = now.getDate();
            const year = now.getFullYear();
            document.getElementById('real-date').innerText = `${year}/${month}/${day}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // GPS 打卡驗證（已加入瀏覽器測試防呆：若定位失敗或超出範圍，預設允許打卡成功供展示測試）
        function handleClockIn(type) {
            const COMPANY_LAT = 25.1182;
            const COMPANY_LNG = 121.5156;
            const ALLOWED_DISTANCE_KM = 0.3;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        const distanceKm = getDistanceFromLatLonInKm(userLat, userLng, COMPANY_LAT, COMPANY_LNG);

                        // 測試期間若您在瀏覽器沒設 Sensors，可直接把這行條件改為 true 或放寬
                        if (distanceKm <= ALLOWED_DISTANCE_KM || true) { 
                            showClockResult(true, type);
                        } else {
                            showClockResult(false, type);
                        }
                    },
                    (error) => {
                        // 瀏覽器抓不到真實手機 GPS 時，直接判定成功（方便您在電腦測試）
                        showClockResult(true, type);
                    },
                    { timeout: 8000, enableHighAccuracy: true }
                );
            } else {
                showClockResult(true, type);
            }
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }

        function showClockResult(isSuccess, type) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            if (isSuccess) {
                content.innerHTML = `
                    <div class="modal-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                            <polyline points="16 11 18 13 22 9"></polyline>
                        </svg>
                    </div>
                    <div class="modal-text">${dateStr}<br>${timeStr} ${type}打卡成功</div>
                `;
            } else {
                content.innerHTML = `
                    <div class="modal-icon">
                        <div style="width: 64px; height: 64px; background-color: #111; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; font-weight: bold;">!</div>
                    </div>
                    <div class="modal-text">${type}打卡失敗<br>您的位置不在打卡範圍內</div>
                `;
            }

            overlay.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function markAsViewedAndGo() {
            ['leave_records', 'overtime_records', 'trip_records'].forEach(key => {
                let records = JSON.parse(localStorage.getItem(key)) || [];
                records = records.map(r => ({ ...r, viewedByUser: true }));
                localStorage.setItem(key, JSON.stringify(records));
            });
            window.location.href = 'history.html';
        }

        function updateBadges() {
            const savedUser = JSON.parse(localStorage.getItem('current_user')) || { role: 'staff' };
            const role = savedUser.role;

            const leaveRecords = JSON.parse(localStorage.getItem('leave_records')) || [];
            const overtimeRecords = JSON.parse(localStorage.getItem('overtime_records')) || [];
            const tripRecords = JSON.parse(localStorage.getItem('trip_records')) || [];

            const pendingBadge = document.getElementById('pending-badge');
            const historyBadge = document.getElementById('history-badge');

            if (role === 'manager') {
                const totalPending = [...leaveRecords, ...overtimeRecords, ...tripRecords].filter(r => r.status === 'pending').length;
                if (pendingBadge) {
                    pendingBadge.innerText = totalPending;
                    pendingBadge.style.display = totalPending > 0 ? 'inline-block' : 'none';
                }
                if (historyBadge) historyBadge.style.display = 'none';
            } else {
                if (pendingBadge) pendingBadge.style.display = 'none';

                const myNotices = [...leaveRecords, ...overtimeRecords, ...tripRecords].filter(
                    r => (r.status === 'approved' || r.status === 'rejected') && !r.viewedByUser
                ).length;
                if (historyBadge) {
                    historyBadge.innerText = myNotices;
                    historyBadge.style.display = myNotices > 0 ? 'inline-block' : 'none';
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initUserSession();
            updateBadges();
        });
        window.addEventListener('pageshow', () => {
            initUserSession();
            updateBadges();
        });
    </script>
</body>
</html>
